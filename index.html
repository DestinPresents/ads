
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e9efff">

    <title>Destin Ads | Premium Feel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <meta name="monetag" content="58cec490218819c9222b87c319dc3ab9">
    
</head>

<body>

    <!-- Animated Background -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>
    <div class="grain"></div>

    <main class="page">

        <section class="panel">

            <!-- Top Header -->
            <div class="top-line">
                <span class="live-dot"></span>
                <span>YOUR SPACE</span>
                <span class="top-line-right">01 / 05</span>
            </div>

            <!-- Heading -->
            <header class="heading">

                <div class="eyebrow">
                    <span></span>
                    SIMPLE • SMOOTH • MODERN
                </div>

                <h1>
                    Choose your<br>
                    <em>destination.</em>
                </h1>

                <p>A little interaction, a lot of motion.</p>

            </header>

            <!-- Five Buttons -->
            <nav class="button-stack">

                <button class="menu-button" data-number="01" data-label="Button One">

                    <span class="button-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 12h16M13 5l7 7-7 7"/>
                        </svg>
                    </span>

                    <span class="button-copy">
                        <small>01 / EXPLORE</small>
                        <strong>Button One</strong>
                    </span>

                    <span class="button-arrow">↗</span>
                    <span class="button-shine"></span>

                </button>


                <button class="menu-button" data-number="02" data-label="Button Two">

                    <span class="button-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>
                        </svg>
                    </span>

                    <span class="button-copy">
                        <small>02 / DISCOVER</small>
                        <strong>Button Two</strong>
                    </span>

                    <span class="button-arrow">↗</span>
                    <span class="button-shine"></span>

                </button>


                <button class="menu-button" data-number="03" data-label="Button Three">

                    <span class="button-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2.8 14.8 9l6.4.7-4.8 4.3 1.3 6.3L12 17l-5.7 3.3 1.3-6.3-4.8-4.3L9.2 9 12 2.8Z"/>
                        </svg>
                    </span>

                    <span class="button-copy">
                        <small>03 / FEATURED</small>
                        <strong>Button Three</strong>
                    </span>

                    <span class="button-arrow">↗</span>
                    <span class="button-shine"></span>

                </button>


                <button class="menu-button" data-number="04" data-label="Button Four">

                    <span class="button-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 6.5h16v11H4zM8 3.5h8M8 20.5h8M8 10h8M8 14h5"/>
                        </svg>
                    </span>

                    <span class="button-copy">
                        <small>04 / COLLECTION</small>
                        <strong>Button Four</strong>
                    </span>

                    <span class="button-arrow">↗</span>
                    <span class="button-shine"></span>

                </button>


                <button class="menu-button" data-number="05" data-label="Button Five">

                    <span class="button-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3a9 9 0 1 0 9 9M12 7v5l3.5 2M17 3v5h5"/>
                        </svg>
                    </span>

                    <span class="button-copy">
                        <small>05 / GET STARTED</small>
                        <strong>Button Five</strong>
                    </span>

                    <span class="button-arrow">↗</span>
                    <span class="button-shine"></span>

                </button>

            </nav>

            <!-- Footer -->
            <footer class="footer">

                <span>
                    <i class="footer-pulse"></i>
                    DESIGNED TO FEEL DIFFERENT
                </span>

                <span class="footer-note">
                    MOVE • TAP • ENJOY
                </span>

            </footer>

        </section>

        <!-- Notification -->
        <div class="toast" role="status">
            <span class="toast-check">✓</span>
            <span class="toast-message">Button selected</span>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
